name: Java Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run unit tests
        run: |
          if [ -f "pom.xml" ]; then
            mvn -B test
          elif [ -f "PoePart3/pom.xml" ]; then
            mvn -B -f PoePart3/pom.xml test
          else
            echo "pom.xml not found"
            exit 1
          fi
